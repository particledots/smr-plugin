name: Capture analysis (Milestone 3)

# Job 1: self-test of the analysis tool on fake recordings with known answers.
# Job 2 (only after job 1 passes, and not on pull requests): analyse the real hardware recordings attached to the
# GitHub release tagged capture-1 (asset SMRCapture.zip).
# Job 3 (after job 2): render the port at the identified settings and compare with the hardware (compare_port.py).
# Job 4 (port-fit, after job 1): M2-b test (port at the hardware core rate 95,982.142857 Hz), odds Freq-jack offset sweep, Q fit, high-frequency tilt
# (tools/analysis/port_fit.py), and the port's built-in default path (resampled, since 2026-10-26 the core rate is 671875/7 Hz) against the hardware.
# Job 5 (port-noise, after job 1): M3-k, the Q max width gap: hardware noise floor, noise added to the port, repeatability of the width
# measurement, rounding sensitivity (tools/analysis/port_noise.py).
# Jobs 3 and 4 use the renderer's --core-rate option (file processed one to one) so their numbers stay comparable with the runs made before
# the built-in core rate was changed; job 3 now says 96000/1 explicitly (it used the built-in 96000 then).
# Results appear as annotations on the run (CI logs cannot be downloaded in Claude's session).

on:
  push:
    branches: [ main, master ]
    paths:
      - 'tools/analysis/**'
      - 'tools/capture/gen_signals.py'
      - 'tools/smr_render/**'
      - 'src/core/**'
      - 'src/host/**'
      - 'src/plugin/**'
      - 'tests/plugin_tests.cpp'
      - 'CMakeLists.txt'
      - '.github/workflows/analysis.yml'
  pull_request:
    paths:
      - 'tools/analysis/**'
      - 'tools/capture/gen_signals.py'
      - 'tools/smr_render/**'
      - 'src/core/**'
      - 'src/host/**'
      - 'src/plugin/**'
      - 'tests/plugin_tests.cpp'
      - 'CMakeLists.txt'
      - '.github/workflows/analysis.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag holding the capture'
        default: 'capture-1'

jobs:
  analysis-selftest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install numpy and scipy
        run: |
          python -m pip install -r tools/analysis/requirements.txt
          python -c "import numpy, scipy; print('numpy', numpy.__version__, 'scipy', scipy.__version__)"

      - name: Self-test on fake recordings
        run: |
          python tools/analysis/selftest.py "$RUNNER_TEMP/selftest"

  analyse-capture:
    needs: analysis-selftest
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CAPTURE_TAG: ${{ github.event.inputs.tag || 'capture-1' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install numpy and scipy
        run: python -m pip install -r tools/analysis/requirements.txt

      - name: Download the capture from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/cap"
          gh release download "$CAPTURE_TAG" --repo "${{ github.repository }}" --pattern 'SMRCapture.zip' --dir "$RUNNER_TEMP/cap"
          sha=$(sha256sum "$RUNNER_TEMP/cap/SMRCapture.zip" | cut -d' ' -f1)
          size=$(stat -c %s "$RUNNER_TEMP/cap/SMRCapture.zip")
          unzip -q "$RUNNER_TEMP/cap/SMRCapture.zip" -x '__MACOSX/*' -d "$RUNNER_TEMP/cap/x"
          echo "::notice title=Capture asset::tag $CAPTURE_TAG, SMRCapture.zip, $size bytes, sha256 $sha"
          find "$RUNNER_TEMP/cap/x" -name '*.wav' | sort

      - name: Analyse the recordings
        run: |
          d=$(find "$RUNNER_TEMP/cap/x" -type d -name SMRCapture | head -1)
          [ -n "$d" ] || d="$RUNNER_TEMP/cap/x"
          python tools/analysis/analyse_capture.py "$d" --json "$RUNNER_TEMP/analysis_result.json"

      - name: Keep the numbers
        uses: actions/upload-artifact@v4
        with:
          name: capture-analysis-result
          path: ${{ runner.temp }}/analysis_result.json

  compare-port:
    needs: analyse-capture
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CAPTURE_TAG: ${{ github.event.inputs.tag || 'capture-1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install numpy and scipy
        run: python -m pip install -r tools/analysis/requirements.txt

      - name: Build smr_render (core only, GCC)
        run: |
          cmake -S . -B build_cmp -DSMR_CORE_ONLY=ON -DCMAKE_BUILD_TYPE=Release > cmake_log.txt 2>&1 || { tail -30 cmake_log.txt; echo "::error::cmake failed"; exit 1; }
          cmake --build build_cmp --target smr_render -j4 > build_log.txt 2>&1 || { tail -40 build_log.txt; echo "::error::smr_render build failed: $(grep -m1 'error' build_log.txt | cut -c1-300)"; exit 1; }
          echo "::notice::smr_render built"

      - name: Download the capture from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/cap"
          gh release download "$CAPTURE_TAG" --repo "${{ github.repository }}" --pattern 'SMRCapture.zip' --dir "$RUNNER_TEMP/cap"
          unzip -q "$RUNNER_TEMP/cap/SMRCapture.zip" -x '__MACOSX/*' -d "$RUNNER_TEMP/cap/x"

      - name: Render the port and compare (variants base, offset, bank2; core rate 96000/1 as before)
        run: |
          d=$(find "$RUNNER_TEMP/cap/x" -type d -name SMRCapture | head -1)
          [ -n "$d" ] || d="$RUNNER_TEMP/cap/x"
          mkdir -p "$RUNNER_TEMP/out"
          for v in base offset bank2; do
            python tools/analysis/port_passes.py --render build_cmp/smr_render --outdir "$RUNNER_TEMP/port_$v" --variant $v --core-rate 96000/1
            python tools/analysis/compare_port.py "$d" "$RUNNER_TEMP/port_$v" --label $v --json "$RUNNER_TEMP/out/compare_$v.json"
          done

      - name: Keep the numbers
        uses: actions/upload-artifact@v4
        with:
          name: port-comparison-result
          path: ${{ runner.temp }}/out/*.json

  port-fit:
    needs: analysis-selftest
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CAPTURE_TAG: ${{ github.event.inputs.tag || 'capture-1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install numpy and scipy
        run: python -m pip install -r tools/analysis/requirements.txt

      - name: Build smr_render (core only, GCC)
        run: |
          cmake -S . -B build_fit -DSMR_CORE_ONLY=ON -DCMAKE_BUILD_TYPE=Release > cmake_log.txt 2>&1 || { tail -30 cmake_log.txt; echo "::error::cmake failed"; exit 1; }
          cmake --build build_fit --target smr_render -j4 > build_log.txt 2>&1 || { tail -40 build_log.txt; echo "::error::smr_render build failed: $(grep -m1 'error' build_log.txt | cut -c1-300)"; exit 1; }
          echo "::notice::smr_render built"

      - name: Download the capture from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/cap"
          gh release download "$CAPTURE_TAG" --repo "${{ github.repository }}" --pattern 'SMRCapture.zip' --dir "$RUNNER_TEMP/cap"
          unzip -q "$RUNNER_TEMP/cap/SMRCapture.zip" -x '__MACOSX/*' -d "$RUNNER_TEMP/cap/x"

      - name: M2-b, port at the hardware core rate 671875/7 = 95982.142857 Hz (variants base and offset)
        run: |
          d=$(find "$RUNNER_TEMP/cap/x" -type d -name SMRCapture | head -1)
          [ -n "$d" ] || d="$RUNNER_TEMP/cap/x"
          mkdir -p "$RUNNER_TEMP/out"
          for v in base offset; do
            python tools/analysis/port_passes.py --render build_fit/smr_render --outdir "$RUNNER_TEMP/hwrate_$v" --variant $v --core-rate 671875/7
            python tools/analysis/compare_port.py "$d" "$RUNNER_TEMP/hwrate_$v" --label "${v}_at_95982.14Hz" --port-rate 95982.142857143 --json "$RUNNER_TEMP/out/compare_hwrate_$v.json"
          done

      - name: The built-in default path (resampled, core rate 671875/7) against the hardware, variants base and offset
        run: |
          d=$(find "$RUNNER_TEMP/cap/x" -type d -name SMRCapture | head -1)
          [ -n "$d" ] || d="$RUNNER_TEMP/cap/x"
          mkdir -p "$RUNNER_TEMP/out"
          for v in base offset; do
            python tools/analysis/port_passes.py --render build_fit/smr_render --outdir "$RUNNER_TEMP/default_$v" --variant $v
            python tools/analysis/compare_port.py "$d" "$RUNNER_TEMP/default_$v" --label "${v}_default_path_resampled" --json "$RUNNER_TEMP/out/compare_default_$v.json"
          done

      - name: Odds offset sweep, Q fit and high-frequency tilt (core rate 95982.142857 Hz)
        run: |
          d=$(find "$RUNNER_TEMP/cap/x" -type d -name SMRCapture | head -1)
          [ -n "$d" ] || d="$RUNNER_TEMP/cap/x"
          python tools/analysis/port_fit.py "$d" --render build_fit/smr_render --json "$RUNNER_TEMP/out/port_fit.json"

      - name: Keep the numbers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: port-fit-result
          path: ${{ runner.temp }}/out/*.json

  port-noise:
    needs: analysis-selftest
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CAPTURE_TAG: ${{ github.event.inputs.tag || 'capture-1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install numpy and scipy
        run: python -m pip install -r tools/analysis/requirements.txt

      - name: Build smr_render (core only, GCC), normal and with fused multiply-add allowed (M3-k rounding test only)
        run: |
          cmake -S . -B build_n -DSMR_CORE_ONLY=ON -DCMAKE_BUILD_TYPE=Release > cmake_log.txt 2>&1 || { tail -30 cmake_log.txt; echo "::error::cmake failed"; exit 1; }
          cmake --build build_n --target smr_render -j4 > build_log.txt 2>&1 || { tail -40 build_log.txt; echo "::error::smr_render build failed: $(grep -m1 'error' build_log.txt | cut -c1-300)"; exit 1; }
          cmake -S . -B build_nf -DSMR_CORE_ONLY=ON -DCMAKE_BUILD_TYPE=Release -DSMR_FP_CONTRACT=fast > cmake_log2.txt 2>&1 || { tail -30 cmake_log2.txt; echo "::error::cmake (fused) failed"; exit 1; }
          cmake --build build_nf --target smr_render -j4 > build_log2.txt 2>&1 || { tail -40 build_log2.txt; echo "::error::smr_render (fused) build failed: $(grep -m1 'error' build_log2.txt | cut -c1-300)"; exit 1; }
          echo "::notice::smr_render built, fused-multiply-add instructions in the fused build: $(objdump -d build_nf/smr_render | grep -cE 'vfn?m(add|sub)[0-9]*s[sd]'), in the normal build: $(objdump -d build_n/smr_render | grep -cE 'vfn?m(add|sub)[0-9]*s[sd]')"

      - name: Download the capture from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/cap"
          gh release download "$CAPTURE_TAG" --repo "${{ github.repository }}" --pattern 'SMRCapture.zip' --dir "$RUNNER_TEMP/cap"
          unzip -q "$RUNNER_TEMP/cap/SMRCapture.zip" -x '__MACOSX/*' -d "$RUNNER_TEMP/cap/x"

      - name: M3-k noise floor, noise test, repeatability and rounding sensitivity
        run: |
          d=$(find "$RUNNER_TEMP/cap/x" -type d -name SMRCapture | head -1)
          [ -n "$d" ] || d="$RUNNER_TEMP/cap/x"
          mkdir -p "$RUNNER_TEMP/out"
          python tools/analysis/port_noise.py "$d" --render build_n/smr_render --render-fma build_nf/smr_render --seeds 8 --json "$RUNNER_TEMP/out/port_noise.json"

      - name: Keep the numbers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: port-noise-result
          path: ${{ runner.temp }}/out/*.json

  # Milestone 5: the real plugin code (JUCE processor, parameters, saved state, resampler, denormal flush) rendered through the capture-1
  # passes at the identified state and measured by the same code as the hardware and the core. macOS, because the plugin needs JUCE.
  compare-plugin:
    needs: analysis-selftest
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    permissions:
      contents: read
    env:
      CAPTURE_TAG: ${{ github.event.inputs.tag || 'capture-1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install numpy and scipy
        run: python -m pip install -r tools/analysis/requirements.txt

      - name: Build smr_plugin_tests and smr_render (arm64)
        run: |
          cmake -S . -B build_pl -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 > cmake_log.txt 2>&1 || { tail -30 cmake_log.txt; echo "::error::cmake failed"; exit 1; }
          cmake --build build_pl --target smr_plugin_tests smr_render -j4 > build_log.txt 2>&1 || {
            grep -E "error|Error" build_log.txt | head -8 | cut -c1-400 | while IFS= read -r line; do echo "::error::BUILD: $line"; done
            tail -20 build_log.txt; exit 1; }
          echo "::notice::smr_plugin_tests and smr_render built"

      - name: Download the capture from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/cap"
          gh release download "$CAPTURE_TAG" --repo "${{ github.repository }}" --pattern 'SMRCapture.zip' --dir "$RUNNER_TEMP/cap"
          unzip -q "$RUNNER_TEMP/cap/SMRCapture.zip" -x '__MACOSX/*' -d "$RUNNER_TEMP/cap/x"

      - name: Plugin and core renders of the capture passes, compared with the hardware and with each other
        run: |
          d=$(find "$RUNNER_TEMP/cap/x" -type d -name SMRCapture | head -1)
          [ -n "$d" ] || d="$RUNNER_TEMP/cap/x"
          plug=$(find build_pl -name smr_plugin_tests -type f -perm -u+x | head -1)
          mkdir -p "$RUNNER_TEMP/out"
          # Plugin: default (resampled) path, odds Freq-jack offset emulated by the Freq (odds) parameter at ADC count 15.
          python tools/analysis/port_passes.py --render "$plug" --outdir "$RUNNER_TEMP/plugin_offset" --variant offset
          python tools/analysis/compare_port.py "$d" "$RUNNER_TEMP/plugin_offset" --label "plugin_offset_default_path" --json "$RUNNER_TEMP/out/compare_plugin_offset.json"
          # Core through smr_render on the same path (block 512 like the plugin run), for the sample-by-sample difference.
          python tools/analysis/port_passes.py --render build_pl/smr_render --outdir "$RUNNER_TEMP/core_offset" --variant offset
          python tools/analysis/compare_port.py "$d" "$RUNNER_TEMP/core_offset" --label "core_offset_default_path_macOS" --json "$RUNNER_TEMP/out/compare_core_offset.json"
          python tools/analysis/diff_renders.py "$RUNNER_TEMP/core_offset" "$RUNNER_TEMP/plugin_offset" --label "core (smr_render, trackoffset 15) against plugin (Freq odds ADC 15)"

      - name: Keep the numbers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-comparison-result
          path: ${{ runner.temp }}/out/*.json
