name: Build plugin (macOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:      # adds a "Run workflow" button in the Actions tab

env:
  SMR_PINNED_COMMIT: 79bc953bb4b9cf47614d317b4ba9fc9f615c43ea

jobs:
  # ---------------------------------------------------------------------------------------------------------
  # Milestone 2, V1 and V1a: the unmodified firmware files (the oracle) against the port, bit for bit.
  # Ubuntu with GCC, because the firmware needs -fsingle-precision-constant, which Clang does not have.
  oracle-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check the firmware submodule is at the pinned commit
        run: |
          actual=$(git -C third_party/SMR rev-parse HEAD)
          [ "$actual" = "$SMR_PINNED_COMMIT" ] || { echo "::error::third_party/SMR is not at the pinned commit ($actual)"; exit 1; }
          gcc --version | head -1

      - name: Build the port tools with GCC (-O2 -ffp-contract=off)
        run: |
          cmake -S . -B build_linux -DSMR_CORE_ONLY=ON -DCMAKE_BUILD_TYPE=Release > cmake_log.txt 2>&1 || {
            tail -20 cmake_log.txt; grep -E "error|Error" cmake_log.txt | head -8 | cut -c1-400 | while IFS= read -r line; do echo "::error::CONFIGURE: $line"; done; exit 1; }
          cmake --build build_linux --target port_driver gen_stimulus trace_diff smr_core_tests smr_param_tests -j4 > build_log.txt 2>&1 || {
            grep -E "error|Error" build_log.txt | head -15 | cut -c1-400 | while IFS= read -r line; do echo "::error::BUILD(port): $line"; done
            tail -30 build_log.txt; exit 1; }
          tail -3 build_log.txt
          echo "::notice::BUILD(port) GCC ok: port_driver gen_stimulus trace_diff smr_core_tests smr_param_tests"

      - name: Build the oracle (unmodified firmware files plus the test shim)
        run: |
          set -u
          FW=third_party/SMR
          mkdir -p oracle_build
          sed -n '/^float DEFAULT_user_scalebank\[21\]={/,/^};/p' $FW/user_scales.c > oracle_build/default_user_scalebank.inc
          [ -s oracle_build/default_user_scalebank.inc ] || { echo "::error::could not extract DEFAULT_user_scalebank"; exit 1; }
          CF="-std=gnu99 -O2 -ffp-contract=off -fsingle-precision-constant -fno-tree-loop-distribute-patterns -w -Itests/oracle/shim -I$FW -I$FW/filter_coefs -Ioracle_build"
          fail=0
          for f in filter params rotation lpf envout_pwm; do
            gcc $CF "-Dasm(...)=result=oracle_usat12(result)" -c $FW/$f.c -o oracle_build/$f.o > oracle_build/$f.log 2>&1 || { fail=1; echo "---- $f.c"; cat oracle_build/$f.log
              grep -E "error" oracle_build/$f.log | head -12 | cut -c1-400 | while IFS= read -r line; do echo "::error::ORACLE-COMPILE $f.c: $line"; done; }
          done
          gcc $CF -c tests/oracle/shim/shim_globals.c -o oracle_build/shim_globals.o > oracle_build/shim.log 2>&1 || { fail=1; cat oracle_build/shim.log
              grep -E "error" oracle_build/shim.log | head -12 | cut -c1-400 | while IFS= read -r line; do echo "::error::ORACLE-COMPILE shim_globals.c: $line"; done; }
          g++ -std=c++17 -O2 -ffp-contract=off -Itests/oracle -c tests/oracle/oracle_driver.cpp -o oracle_build/oracle_driver.o > oracle_build/driver.log 2>&1 || { fail=1; cat oracle_build/driver.log
              grep -E "error" oracle_build/driver.log | head -12 | cut -c1-400 | while IFS= read -r line; do echo "::error::ORACLE-COMPILE oracle_driver.cpp: $line"; done; }
          [ $fail -eq 0 ] || exit 1
          g++ oracle_build/*.o -o oracle_driver -lm > oracle_build/link.log 2>&1 || {
            cat oracle_build/link.log
            grep -o "undefined reference to .*" oracle_build/link.log | sort -u | head -40 | cut -c1-200 | while IFS= read -r line; do echo "::error::ORACLE-LINK: $line"; done
            grep -E "multiple definition" oracle_build/link.log | sort -u | head -10 | cut -c1-300 | while IFS= read -r line; do echo "::error::ORACLE-LINK: $line"; done
            exit 1; }
          echo "::notice::BUILD(oracle) GCC ok: firmware filter.c params.c rotation.c lpf.c envout_pwm.c linked with the shim"

      - name: V1a table fidelity (tables the firmware really uses against the port's tables)
        run: |
          ./oracle_driver tables oracle_tables.trace
          ./build_linux/port_driver tables port_tables.trace
          if out=$(./build_linux/trace_diff oracle_tables.trace port_tables.trace); then
            echo "$out"; echo "::notice::V1a tables PASS: $out"
          else
            echo "$out"; echo "::error::V1a tables FAIL: $out"; exit 1
          fi

      - name: V1 differential test (8 scenarios x 30000 blocks, bit for bit)
        run: |
          bad=0
          for i in 0 1 2 3 4 5 6 7; do
            ./build_linux/gen_stimulus $i 30000 stim_$i.bin || { echo "::error::V1 scenario $i: gen_stimulus failed"; bad=1; continue; }
            ./oracle_driver trace stim_$i.bin oracle_$i.trace || { echo "::error::V1 scenario $i: oracle_driver failed"; bad=1; continue; }
            pout=$(./build_linux/port_driver trace stim_$i.bin port_$i.trace) || { echo "::error::V1 scenario $i: port_driver failed"; bad=1; continue; }
            echo "$pout"
            valid=${pout##*valid_steps=}
            # Past the first output saturation the x86 oracle (float overflow gives INT_MIN) and the ARM-style port (clamps) differ by design.
            if [ "$valid" -lt 500 ]; then echo "::error::V1 scenario $i: only $valid valid steps before the first saturation ($pout)"; bad=1; continue; fi
            if out=$(./build_linux/trace_diff oracle_$i.trace port_$i.trace $valid); then
              echo "::notice::V1 scenario $i PASS: $out ($pout)"
            else
              echo "::error::V1 scenario $i FAIL: $out ($pout)"; bad=1
            fi
          done
          exit $bad

      - name: V1 negative control (one changed input sample must be detected)
        run: |
          python3 - <<'PY'
          d = bytearray(open('stim_0.bin', 'rb').read())
          off = 12 + 195 * 100 + 67 + 1      # step 100, inL[0], second byte
          d[off] ^= 0x40
          open('stim_ctl.bin', 'wb').write(d)
          PY
          ./build_linux/port_driver trace stim_ctl.bin port_ctl.trace > /dev/null
          if ./build_linux/trace_diff oracle_0.trace port_ctl.trace > ctl_out.txt; then
            cat ctl_out.txt; echo "::error::V1 negative control FAIL: the comparison did not notice a changed input sample"; exit 1
          else
            cat ctl_out.txt; echo "::notice::V1 negative control PASS (comparison detects a change): $(cat ctl_out.txt)"
          fi

      - name: Core tests with GCC on x86-64 (V2, V3, V5, scheduler, adapter, resampler)
        run: |
          ./build_linux/smr_core_tests > core_tests_log.txt 2>&1; code=$?
          cat core_tests_log.txt
          grep -E "^FAIL" core_tests_log.txt | head -15 | cut -c1-400 | while IFS= read -r line; do echo "::error::TEST(linux): $line"; done
          echo "::notice::TEST(linux) $(grep -E '^(PASS|FAIL): [0-9]+ checks' core_tests_log.txt) $(grep '^INFO' core_tests_log.txt)"
          grep -E "^PASS: V5" core_tests_log.txt | cut -c1-300 | while IFS= read -r line; do echo "::notice::TEST(linux) $line"; done
          exit $code

      - name: Milestone 4 parameter, mapping and state tests with GCC on x86-64
        run: |
          ./build_linux/smr_param_tests > param_tests_log.txt 2>&1; code=$?
          cat param_tests_log.txt
          grep -E "^FAIL" param_tests_log.txt | head -15 | cut -c1-400 | while IFS= read -r line; do echo "::error::PARAM-TEST(linux): $line"; done
          echo "::notice::PARAM-TEST(linux) $(grep -E '^(PASS|FAIL): [0-9]+ checks' param_tests_log.txt)"
          exit $code

  # ---------------------------------------------------------------------------------------------------------
  # Milestone 2 on macOS: core tests, V4 (arm64 against x86-64), V6 (renderer end to end), renderer artifact.
  core-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure and build tests and renderer (universal, macOS 12.0 minimum)
        run: |
          cmake -S . -B build -DSMR_CORE_ONLY=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 > cmake_log.txt 2>&1 || {
            tail -20 cmake_log.txt; grep -E "error|Error" cmake_log.txt | head -8 | cut -c1-400 | while IFS= read -r line; do echo "::error::CONFIGURE: $line"; done; exit 1; }
          cmake --build build --target smr_core_tests smr_param_tests smr_render wav_tool -j4 > build_log.txt 2>&1 || {
            grep -E "error|Error" build_log.txt | head -15 | cut -c1-400 | while IFS= read -r line; do echo "::error::BUILD(mac): $line"; done
            tail -30 build_log.txt; exit 1; }
          tail -3 build_log.txt
          for b in smr_core_tests smr_param_tests smr_render wav_tool; do echo "$b: $(lipo -archs build/$b)"; done
          echo "::notice::BUILD(mac) ok: smr_core_tests smr_render wav_tool, archs $(lipo -archs build/smr_render)"

      - name: Core tests (arm64 native)
        run: |
          arch -arm64 ./build/smr_core_tests > core_tests_arm64.txt 2>&1; code=$?
          cat core_tests_arm64.txt
          grep -E "^FAIL" core_tests_arm64.txt | head -15 | cut -c1-400 | while IFS= read -r line; do echo "::error::TEST(arm64): $line"; done
          echo "::notice::TEST(arm64) $(grep -E '^(PASS|FAIL): [0-9]+ checks' core_tests_arm64.txt) $(grep '^INFO' core_tests_arm64.txt)"
          grep -E "^PASS: V5" core_tests_arm64.txt | cut -c1-300 | while IFS= read -r line; do echo "::notice::TEST(arm64) $line"; done
          exit $code

      - name: Core tests (x86-64 through Rosetta)
        continue-on-error: true
        run: |
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            softwareupdate --install-rosetta --agree-to-license > rosetta_log.txt 2>&1 || true
          fi
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "::warning::V4 SKIPPED: this runner cannot run x86-64 code (Rosetta not available)"; exit 0
          fi
          arch -x86_64 ./build/smr_core_tests > core_tests_x86.txt 2>&1; code=$?
          grep -E "^FAIL" core_tests_x86.txt | head -15 | cut -c1-400 | while IFS= read -r line; do echo "::error::TEST(x86-64): $line"; done
          echo "::notice::TEST(x86-64) $(grep -E '^(PASS|FAIL): [0-9]+ checks' core_tests_x86.txt) $(grep '^INFO' core_tests_x86.txt)"
          h_arm=$(arch -arm64 ./build/smr_core_tests --hash)
          h_x86=$(arch -x86_64 ./build/smr_core_tests --hash)
          echo "arm64:  $h_arm"; echo "x86-64: $h_x86"
          if [ "$h_arm" = "$h_x86" ]; then echo "::notice::V4 PASS: identical fixed-render hash on arm64 and x86-64: $h_arm"
          else echo "::error::V4 FAIL: arm64 $h_arm, x86-64 $h_x86"; code=1; fi
          exit $code

      - name: Milestone 4 parameter tests (arm64 native, and x86-64 through Rosetta if available)
        run: |
          arch -arm64 ./build/smr_param_tests > param_arm64.txt 2>&1; code=$?
          cat param_arm64.txt
          grep -E "^FAIL" param_arm64.txt | head -15 | cut -c1-400 | while IFS= read -r line; do echo "::error::PARAM-TEST(arm64): $line"; done
          echo "::notice::PARAM-TEST(arm64) $(grep -E '^(PASS|FAIL): [0-9]+ checks' param_arm64.txt)"
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            arch -x86_64 ./build/smr_param_tests > param_x86.txt 2>&1; c2=$?
            grep -E "^FAIL" param_x86.txt | head -15 | cut -c1-400 | while IFS= read -r line; do echo "::error::PARAM-TEST(x86-64): $line"; done
            echo "::notice::PARAM-TEST(x86-64) $(grep -E '^(PASS|FAIL): [0-9]+ checks' param_x86.txt)"
            [ $c2 -eq 0 ] || code=1
          else
            echo "::warning::PARAM-TEST x86-64 SKIPPED: Rosetta not available"
          fi
          exit $code

      - name: V6 renderer end to end (mono and stereo; 44.1, 48 and 96 kHz)
        run: |
          mkdir -p v6 && cd v6
          bad=0
          for rate in 44100 48000 96000; do
            for ch in 1 2; do
              ../build/wav_tool gen in_${rate}_${ch}.wav $rate $ch 3 || { bad=1; continue; }
              ../build/smr_render in_${rate}_${ch}.wav out_${rate}_${ch}.wav > render_${rate}_${ch}.txt 2>&1 || { cat render_${rate}_${ch}.txt; echo "::error::V6 render failed at $rate Hz, $ch ch: $(head -1 render_${rate}_${ch}.txt)"; bad=1; continue; }
              cat render_${rate}_${ch}.txt
              if out=$(../build/wav_tool check out_${rate}_${ch}.wav $rate 4.9); then echo "::notice::V6 $out"; else echo "::error::V6 $out"; bad=1; fi
            done
          done
          # unsupported rate must be refused with a clear message
          ../build/wav_tool gen in_47999.wav 47999 2 1
          if ../build/smr_render in_47999.wav out_47999.wav > refuse.txt 2>&1; then echo "::error::V6 an unsupported sample rate was accepted"; bad=1; else echo "::notice::V6 unsupported rate refused: $(head -1 refuse.txt | cut -c1-200)"; fi
          # controls and script
          printf '0.5 adc 0 3000\n1.0 rotup\n1.5 pot 0 4000\n' > script.txt
          ../build/smr_render in_44100_2.wav out_ctl.wav --mode onepass --type bpre --bank 5 --adc 11=2500 --sw cvlag=1 --script script.txt > ctl.txt 2>&1 || { cat ctl.txt; echo "::error::V6 render with controls failed"; bad=1; }
          if out=$(../build/wav_tool check out_ctl.wav 44100 4.9); then echo "::notice::V6 controls and script: $out"; else echo "::error::V6 controls and script: $out"; bad=1; fi
          exit $bad

      - name: Package the renderer (ad-hoc signed, universal)
        run: |
          mkdir -p dist/smr-render
          cp build/smr_render dist/smr-render/
          codesign --force -s - dist/smr-render/smr_render
          codesign --verify --verbose=2 dist/smr-render/smr_render
          cp docs/renderer-howto.txt dist/smr-render/README.txt
          cp THIRD-PARTY-LICENSES.txt dist/smr-render/
          cp -R licenses dist/smr-render/
          archs=$(lipo -archs dist/smr-render/smr_render)
          for a in arm64 x86_64; do
            lipo -thin $a dist/smr-render/smr_render -output /tmp/slice_$a
            minos=$(otool -l /tmp/slice_$a | grep -A4 -E "LC_BUILD_VERSION|LC_VERSION_MIN" | grep -E "minos|version" | head -1 | awk '{print $2}')
            echo "::notice::INSPECT smr_render slice $a minos=$minos"
            [ "$minos" = "12.0" ] || { echo "::error::smr_render slice $a minos is '$minos', expected 12.0"; exit 1; }
          done
          echo "::notice::INSPECT smr_render archs=$archs"
          (cd dist && ditto -c -k --keepParent smr-render ../Unofficial-SMR-renderer.zip)
          ls -la Unofficial-SMR-renderer.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Unofficial-SMR-renderer-macOS
          path: Unofficial-SMR-renderer.zip

  build-macos:
    runs-on: macos-15     # Apple silicon runner (macos-14 is retired 2 Nov 2026)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Environment
        run: |
          sw_vers
          xcodebuild -version
          cmake --version | head -1
          uname -m

      - name: Check the firmware submodule is at the pinned commit
        run: |
          actual=$(git -C third_party/SMR rev-parse HEAD)
          echo "third_party/SMR is at: $actual"
          echo "pinned commit is:      $SMR_PINNED_COMMIT"
          if [ "$actual" != "$SMR_PINNED_COMMIT" ]; then
            echo "::error::third_party/SMR is not at the pinned commit"; exit 1
          fi
          echo "licence copy matches submodule LICENSE?"
          cmp licenses/SMR-LICENSE.txt third_party/SMR/LICENSE && echo "yes, identical"

      - name: Configure (universal, macOS 12.0 minimum)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0

      - name: Build core test, then run it
        run: |
          # Failures are also written as annotations (shown on the run page).
          cmake --build build --target core_test -j4 > build_log.txt 2>&1 || {
            grep -E "error|Error" build_log.txt | head -8 | while IFS= read -r line; do echo "::error::BUILD: $line"; done
            tail -5 build_log.txt; exit 1; }
          ./build/core_test > test_log.txt 2>&1; code=$?
          cat test_log.txt
          grep -E "FAIL" test_log.txt | head -8 | while IFS= read -r line; do echo "::error::TEST: $line"; done
          exit $code

      - name: Build and run the Milestone 4 parameter tests (universal, arm64 native)
        run: |
          cmake --build build --target smr_param_tests -j4 > param_build_log.txt 2>&1 || {
            grep -E "error|Error" param_build_log.txt | head -8 | while IFS= read -r line; do echo "::error::BUILD(param tests): $line"; done
            tail -20 param_build_log.txt; exit 1; }
          arch -arm64 ./build/smr_param_tests > param_log.txt 2>&1; code=$?
          grep -E "^FAIL" param_log.txt | head -8 | while IFS= read -r line; do echo "::error::PARAM-TEST(plugin job): $line"; done
          echo "::notice::PARAM-TEST(plugin job) $(grep -E '^(PASS|FAIL): [0-9]+ checks' param_log.txt)"
          exit $code

      - name: Build and run the Milestone 5 plugin tests (the real plugin code, headless; arm64 native, then x86_64 under Rosetta)
        run: |
          cmake --build build --target smr_plugin_tests -j4 > plugtest_build_log.txt 2>&1 || {
            grep -E "error|Error" plugtest_build_log.txt | head -12 | cut -c1-400 | while IFS= read -r line; do echo "::error::BUILD(plugin tests): $line"; done
            tail -20 plugtest_build_log.txt; exit 1; }
          bin=$(find build -name smr_plugin_tests -type f | head -1)
          [ -n "$bin" ] || { echo "::error::smr_plugin_tests binary not found"; exit 1; }
          echo "binary: $bin"; echo "::notice::PLUGIN-TEST binary archs: $(lipo -archs "$bin")"
          fail=0
          for a in arm64 x86_64; do
            code=0; arch -$a "$bin" selftest > plugtest_$a.txt 2>&1 || code=$?
            [ $code -eq 0 ] || fail=1
            echo "::group::plugin tests $a (exit $code)"; cat plugtest_$a.txt; echo "::endgroup::"
            grep -E "^FAIL" plugtest_$a.txt | head -12 | cut -c1-600 | while IFS= read -r line; do echo "::error::PLUGIN-TEST($a): $line"; done
            grep -E "^INFO" plugtest_$a.txt | head -40 | cut -c1-500 | while IFS= read -r line; do echo "::notice::PLUGIN-TEST($a): $line"; done
            echo "::notice::PLUGIN-TEST($a) exit $code: $(grep -E '^(PASS|FAIL): [0-9]+ checks' plugtest_$a.txt)"
          done
          # Does the x86_64 run give the same samples as the arm64 run? The per-check lines carry sample counts and peaks, not hashes,
          # so compare the PASS/FAIL lines only.
          diff <(grep -E "^(PASS|FAIL)" plugtest_arm64.txt) <(grep -E "^(PASS|FAIL)" plugtest_x86_64.txt) > plugtest_arch_diff.txt && echo "::notice::PLUGIN-TEST arm64 and x86_64 give the same PASS/FAIL lines" || echo "::warning::PLUGIN-TEST arm64 and x86_64 differ: $(head -3 plugtest_arch_diff.txt | tr '\n' ' ' | cut -c1-400)"
          exit $fail

      - name: Build AU + VST3
        run: |
          cmake --build build --target SMR_AU SMR_VST3 -j4 > plugin_build_log.txt 2>&1 || {
            grep -E "error|Error" plugin_build_log.txt | head -12 | cut -c1-400 | while IFS= read -r line; do echo "::error::BUILD(plugin): $line"; done
            tail -20 plugin_build_log.txt; exit 1; }
          tail -5 plugin_build_log.txt
          ls -la build/SMR_artefacts/Release/AU build/SMR_artefacts/Release/VST3

      - name: Ad-hoc sign (lets Apple silicon load an unsigned build)
        run: |
          for b in build/SMR_artefacts/Release/AU/*.component build/SMR_artefacts/Release/VST3/*.vst3; do
            codesign --force --deep -s - "$b"
            codesign --verify --deep --strict --verbose=2 "$b"
          done

      - name: Package
        run: |
          mkdir -p dist/Unofficial-SMR
          cp -R build/SMR_artefacts/Release/AU/*.component dist/Unofficial-SMR/
          cp -R build/SMR_artefacts/Release/VST3/*.vst3 dist/Unofficial-SMR/
          cp THIRD-PARTY-LICENSES.txt dist/Unofficial-SMR/
          cp docs/INSTALL.txt dist/Unofficial-SMR/
          cp -R licenses dist/Unofficial-SMR/
          ls -la dist/Unofficial-SMR

      - name: Inspect the build (architectures, minimum macOS, AU identity)
        run: |
          fail=0
          {
            echo "### Build inspection"
            echo "Submodule pinned commit: \`$SMR_PINNED_COMMIT\` (checked above)"
          } >> "$GITHUB_STEP_SUMMARY"
          for b in dist/Unofficial-SMR/*.component dist/Unofficial-SMR/*.vst3; do
            bin=$(ls "$b"/Contents/MacOS/* | head -1)
            archs=$(lipo -archs "$bin")
            echo "== $b"; echo "archs: $archs"
            case "$archs" in *arm64*x86_64*|*x86_64*arm64*) ;; *) echo "::error::$b is not universal: $archs"; fail=1;; esac
            for a in arm64 x86_64; do
              lipo -thin $a "$bin" -output "/tmp/slice_$a"
              minos=$(otool -l "/tmp/slice_$a" | grep -A4 -E "LC_BUILD_VERSION|LC_VERSION_MIN" | grep -E "minos|version" | head -1 | awk '{print $2}')
              echo "  $a minos: $minos"
              [ "$minos" = "12.0" ] || { echo "::error::$b slice $a minos is '$minos', expected 12.0"; fail=1; }
              echo "::notice::INSPECT $(basename "$b") slice $a minos=$minos"
            done
            echo "::notice::INSPECT $(basename "$b") archs=$archs"
            echo "- \`$(basename "$b")\`: archs \`$archs\`" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "== AU Info.plist"
          plutil -p dist/Unofficial-SMR/*.component/Contents/Info.plist | grep -E -A12 "AudioComponents|CFBundleIdentifier|CFBundleName|LSMinimumSystemVersion"
          exit $fail

      - name: auval (informational only; does not fail the build)
        continue-on-error: true
        timeout-minutes: 5
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R dist/Unofficial-SMR/*.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 3
          auval -a | grep -i -E "Ptdt|SMR" || echo "not listed by auval -a"
          set +e
          auval -v aufx Smru Ptdt > auval_log.txt 2>&1; code=$?
          cat auval_log.txt
          tail -4 auval_log.txt | tr '\n' ' ' > auval_tail.txt
          # continue-on-error hides the result from the run's status, so state it as an annotation.
          if [ $code -eq 0 ]; then
            echo "::notice::AUVAL exit 0: $(cat auval_tail.txt)"
          else
            echo "::warning::AUVAL exit $code: $(cat auval_tail.txt)"
          fi
          exit 0

      - name: Zip for download
        run: |
          cd dist
          ditto -c -k --keepParent Unofficial-SMR ../Unofficial-SMR.zip
          cd ..
          ls -la Unofficial-SMR.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Unofficial-SMR-macOS
          path: Unofficial-SMR.zip
