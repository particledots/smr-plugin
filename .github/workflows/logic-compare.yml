name: Logic recordings (Milestone 5)

# Job 1 (make-inputs): writes the two test input files for Bryn's Logic recordings and keeps them as the artifact M5-test-inputs.
# Job 2 (compare-selftest): builds the headless plugin renderer and checks tools/analysis/compare_logic.py on fake bounces (shifted,
#   quantised to 24 bit, one at -3 dB) made from the render itself. It validates the comparison tool, nothing about Logic.
# Job 3 (compare-logic, manual run only): downloads the release holding Bryn's bounces (asset: a .zip of M5_<mac>_<rate>_<setting>.wav files)
#   and compares each with the plugin run headless on the same input and setting. Results appear as annotations.

on:
  push:
    branches: [ main, master ]
    paths:
      - 'tools/capture/gen_m5_signals.py'
      - 'tools/analysis/compare_logic.py'
      - 'tests/plugin_tests.cpp'
      - 'src/plugin/**'
      - 'src/host/**'
      - 'src/core/**'
      - '.github/workflows/logic-compare.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag holding the Logic bounces (a zip of WAV files)'
        default: 'm5-logic-1'

jobs:
  make-inputs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - name: Write the test inputs
        run: |
          python tools/capture/gen_m5_signals.py "$RUNNER_TEMP/m5in"
          (cd "$RUNNER_TEMP/m5in" && shasum -a 256 *.wav | tee SHA256.txt)
          echo "::notice::M5 inputs: $(cd "$RUNNER_TEMP/m5in" && shasum -a 256 *.wav | cut -c1-16,65- | tr '\n' ' ')"
      - uses: actions/upload-artifact@v4
        with:
          name: M5-test-inputs
          path: ${{ runner.temp }}/m5in/*

  compare-selftest:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/analysis/requirements.txt
      - name: Build smr_plugin_tests (arm64)
        run: |
          cmake -S . -B build_pl -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 > cmake_log.txt 2>&1 || { tail -30 cmake_log.txt; echo "::error::cmake failed"; exit 1; }
          cmake --build build_pl --target smr_plugin_tests -j4 > build_log.txt 2>&1 || {
            grep -E "error|Error" build_log.txt | head -8 | cut -c1-400 | while IFS= read -r line; do echo "::error::BUILD: $line"; done
            tail -20 build_log.txt; exit 1; }
      - name: Self-test of compare_logic.py on fake bounces
        run: |
          python tools/capture/gen_m5_signals.py "$RUNNER_TEMP/m5in"
          plug=$(find build_pl -name smr_plugin_tests -type f | head -1)
          python tools/analysis/compare_logic.py --render "$plug" --inputs "$RUNNER_TEMP/m5in" --selftest

  compare-logic:
    if: github.event_name == 'workflow_dispatch'
    needs: compare-selftest
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/analysis/requirements.txt
      - name: Build smr_plugin_tests (arm64)
        run: |
          cmake -S . -B build_pl -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 > cmake_log.txt 2>&1 || { tail -30 cmake_log.txt; echo "::error::cmake failed"; exit 1; }
          cmake --build build_pl --target smr_plugin_tests -j4 > build_log.txt 2>&1 || { tail -20 build_log.txt; echo "::error::build failed"; exit 1; }
      - name: Download the bounces from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/b"
          gh release download "${{ github.event.inputs.tag }}" --repo "${{ github.repository }}" --pattern '*.zip' --dir "$RUNNER_TEMP/b"
          for z in "$RUNNER_TEMP"/b/*.zip; do unzip -q -o "$z" -x '__MACOSX/*' -d "$RUNNER_TEMP/b/x"; done
          find "$RUNNER_TEMP/b/x" -name 'M5_*.wav' | sort
      - name: Compare
        run: |
          python tools/capture/gen_m5_signals.py "$RUNNER_TEMP/m5in"
          plug=$(find build_pl -name smr_plugin_tests -type f | head -1)
          d=$(dirname "$(find "$RUNNER_TEMP/b/x" -name 'M5_*.wav' | head -1)")
          python tools/analysis/compare_logic.py --render "$plug" --inputs "$RUNNER_TEMP/m5in" --bounces "$d"
